<!DOCTYPE html>
<html lang="pt-br">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Importando as fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../../css/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <main class="container">
        <form>
            <h1>CADASTRO</h1>

            <!-- Coluna esquerda -->
            <div class="input-box">
                <input placeholder="Nome Completo" type="text" required>
                <i class='bx bx-id-card'></i>
            </div>

            <div class="input-box">
                <input placeholder="Data de Nascimento" type="date" required>
                <i class='bx bx-calendar'></i>
            </div>

            <div class="input-box">
                <input placeholder="CPF" type="text" maxlength="14" required>
                <i class='bx bx-id-card'></i>
            </div>

            <div class="input-box">
                <input placeholder="Telefone" type="tel" required>
                <i class='bx bx-phone'></i>
            </div>

            <!-- Coluna direita -->
            <div class="input-box">
                <input placeholder="E-mail" type="email" required>
                <i class='bx bx-envelope'></i>
            </div>

            <div class="input-box">
                <input placeholder="Username" type="text" required>
                <i class='bx bx-user'></i>
            </div>

            <div class="input-box">
                <input placeholder="Senha" type="password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <!-- Botão -->
            <button type="submit">Cadastrar</button>

            <!-- Link Login -->
            <div class="register-link">
                <p>Já tem uma conta? <a href="login.html">Login</a></p>
            </div>
        </form>
    </main>       
</body>
</html>
